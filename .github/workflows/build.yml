name: Build EcoAudit_Manager App (Windows)

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dépendances
        run: npm install

      - name: Compiler l'installateur Windows
        run: npm run build

      - name: Mettre le résultat à disposition
        uses: actions/upload-artifact@v4
        with:
          name: EcoAudit_Manager_App-Windows
          path: |
            dist/*.exe
