name: Build EcoAudit_Manager App (Android)

on:
  push:
    branches: [ main ]
    paths:
      - 'android_app/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android_app
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer Java (nécessaire pour Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Installer le kit Android
        uses: android-actions/setup-android@v3

      - name: Installer les dépendances
        run: npm install

      - name: Générer le projet Android natif
        run: npx cap add android

      - name: Synchroniser l'application web dans le projet Android
        run: npx cap sync android

      - name: Compiler le fichier .apk
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Mettre le résultat à disposition
        uses: actions/upload-artifact@v4
        with:
          name: EcoAudit_Manager_App-Android
          path: android_app/android/app/build/outputs/apk/debug/app-debug.apk
